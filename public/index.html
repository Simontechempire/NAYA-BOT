<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080811">
  <title>NAYA BOT | FACELESS TECH</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{min-height:100vh;background:radial-gradient(circle at top,#25204b 0%,transparent 45%),#080811;color:white;display:flex;align-items:center;justify-content:center;padding:20px}
    .container{width:100%;max-width:430px;background:rgba(20,19,39,.96);border:1px solid #39345f;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 15px 55px rgba(0,0,0,.5)}
    .profile{width:112px;height:112px;object-fit:cover;border-radius:50%;border:3px solid #a78bfa;padding:4px;margin-bottom:15px}
    h1{font-size:27px;letter-spacing:2px;margin-bottom:7px}
    .developer{color:#b9a6ff;font-size:13px;margin-bottom:25px}
    .status{display:inline-block;background:#123c2b;color:#65f5ad;padding:8px 15px;border-radius:30px;font-size:12px;margin-bottom:25px}
    .field{text-align:left;margin-bottom:17px}
    label{display:block;color:#c9c4e8;font-size:13px;margin-bottom:9px}
    input{width:100%;padding:15px;border-radius:12px;border:1px solid #48416f;outline:none;background:#0d0c19;color:white;font-size:15px}
    input:focus{border-color:#a78bfa}
    button{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(110deg,#7955df,#b06bf2);color:white;font-weight:bold;font-size:15px;cursor:pointer;margin-top:5px}
    button:disabled{opacity:.6;cursor:not-allowed}
    .result{display:none;margin-top:22px;padding:18px;background:#0d0c19;border:1px solid #51447f;border-radius:14px}
    .result h3{color:#b9a6ff;margin-bottom:12px}
    .code{font-size:27px;font-weight:bold;letter-spacing:5px;color:#8df6c1;margin:12px 0;overflow-wrap:anywhere}
    .message{font-size:13px;color:#c9c4e8;margin-top:14px;line-height:1.6}
    .small{font-size:11px;color:#77728f;margin-top:10px;word-break:break-all}
    .footer{margin-top:25px;color:#77728f;font-size:11px}
  </style>
</head>
<body>
  <main class="container">
    <img class="profile" src="https://files.catbox.moe/4nbm9j.jpg" alt="NAYA BOT profile picture">
    <h1>NAYA BOT</h1>
    <p class="developer">POWERED BY FACELESS TECH</p>
    <div class="status">● PAIRING SERVICE</div>
    <div class="field">
      <label for="number">WhatsApp phone number</label>
      <input id="number" type="tel" placeholder="234XXXXXXXXXX" autocomplete="tel">
    </div>
    <button id="pairButton" onclick="generateCode()">GENERATE PAIRING CODE</button>
    <section class="result" id="result">
      <h3>YOUR PAIRING CODE</h3>
      <div class="code" id="pairCode">--------</div>
      <p class="message" id="resultMessage">Open WhatsApp → Linked Devices → Link a Device → Link with phone number.</p>
      <p class="small" id="sessionInfo"></p>
    </section>
    <p class="footer">© 2026 NAYA BOT · FACELESS TECH</p>
  </main>
  <script>
    const button = document.getElementById('pairButton');
    const result = document.getElementById('result');
    const pairCode = document.getElementById('pairCode');
    const resultMessage = document.getElementById('resultMessage');
    const sessionInfo = document.getElementById('sessionInfo');
    async function generateCode() {
      const number = document.getElementById('number').value.trim().replace(/\D/g, '');
      if (number.length < 10 || number.length > 15) { alert('Enter a valid phone number with country code.'); return; }
      button.disabled = true; button.textContent = 'GENERATING...'; result.style.display = 'none';
      try {
        const response = await fetch('/api/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ number }) });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'Pairing failed.');
        pairCode.textContent = data.code;
        resultMessage.textContent = 'Open WhatsApp → Linked Devices → Link a Device → Link with phone number. Enter this code on your WhatsApp account.';
        // FIX: Show sessionId + expiry so user fit recover
        sessionInfo.textContent = `Expires: ${data.expiresIn || ''} | Session: ${data.sessionId || ''}`;
        result.style.display = 'block';
      } catch (error) { alert(error.message); }
      finally { button.disabled = false; button.textContent = 'GENERATE PAIRING CODE'; }
    }
  </script>
</body>
</html>
